<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shoe Website</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <nav>
            <ul>
                <li><a href="#">Home</a></li>
                <li><a href="#">About</a></li>
                <li><a href="#">Contact</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <section>
            <h1>Welcome to our Shoe Website</h1>
            <p>We offer a wide range of shoes for men, women, and kids.</p>
            <button>Shop Now</button>
        </section>
        <section>
            <h2>Featured Shoes</h2>
            <div class="shoes">
                <div class="shoe">
                    <img src="shoe1.jpg" alt="Shoe 1">
                    <h3>Shoe 1</h3>
                    <p>$100</p>
                </div>
                <div class="shoe">
                    <img src="shoe2.jpg" alt="Shoe 2">
                    <h3>Shoe 2</h3>
                    <p>$150</p>
                </div>
                <div class="shoe">
                    <img src="shoe3.jpg" alt="Shoe 3">
                    <h3>Shoe 3</h3>
                    <p>$200</p>
                </div>
            </div>
        </section>
    </main>
    <footer>
        <p>&copy; 2024 Shoe Website</p>
    </footer>
    <script src="script.js"></script>

</html>
